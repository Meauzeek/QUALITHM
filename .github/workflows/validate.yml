name: Validate QUALITHM
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check script.js
      - run: node --check metadata-lookup.js
      - run: node --check palette.js
      - run: node tools/sync-seed.mjs --check
      - run: node tests/release-check.cjs
